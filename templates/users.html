<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户列表</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 36px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 480px;
            width: 90%;
        }
        .card h3 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .card ul {
            list-style: none;
            margin-bottom: 24px;
        }
        .card li {
            padding: 14px 16px;
            background: #f8f9fb;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 15px;
            color: #444;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card li .id-badge {
            background: #667eea;
            color: #fff;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .back-link {
            display: block;
            text-align: center;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>欢迎, {{ username }}</h3>
        {% if users %}
        <ul>
            {% for user in users %}
            <li>
                <span class="id-badge">#{{ user.id }}</span>
                {{ user.username }} - {{ user.age }}岁
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p style="text-align:center;color:#999;padding:20px 0;">暂无用户</p>
        {% endif %}
        <a class="back-link" href="/page">返回首页</a>
    </div>
</body>
</html>
