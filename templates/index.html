<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            width: 100%;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 36px 28px;
            width: 340px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .card h2 {
            margin-bottom: 24px;
            color: #333;
            font-size: 22px;
            text-align: center;
        }
        .card input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 14px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }
        .card input:focus {
            border-color: #667eea;
        }
        .card button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.2s;
        }
        .card button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>注册</h2>
            <form action="/register" method="post">
                <input name="username" placeholder="用户名" required>
                <input name="age" type="number" placeholder="年龄" required>
                <input name="password" type="password" placeholder="密码" required>
                <button type="submit">注册</button>
            </form>
        </div>
        <div class="card">
            <h2>登录</h2>
            <form action="/login" method="post">
                <input name="username" placeholder="用户名" required>
                <input name="password" type="password" placeholder="密码" required>
                <button type="submit">登录</button>
            </form>
        </div>
    </div>
</body>
</html>
